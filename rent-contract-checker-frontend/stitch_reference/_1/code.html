<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#f0f1f2",
                    "on-error": "#ffffff",
                    "surface-bright": "#f8f9fa",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#d9dadb",
                    "background": "#f8f9fa",
                    "surface-tint": "#0053db",
                    "on-tertiary-fixed-variant": "#3f465c",
                    "tertiary-container": "#656d84",
                    "on-error-container": "#93000a",
                    "error": "#ba1a1a",
                    "on-secondary-fixed": "#261a00",
                    "primary-container": "#2563eb",
                    "on-surface-variant": "#434655",
                    "on-secondary": "#ffffff",
                    "surface-container-high": "#e7e8e9",
                    "secondary-fixed": "#ffdf9f",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#191c1d",
                    "on-primary-fixed-variant": "#003ea8",
                    "inverse-surface": "#2e3132",
                    "surface-container": "#edeeef",
                    "on-tertiary-container": "#eef0ff",
                    "on-secondary-container": "#6f5100",
                    "on-primary-fixed": "#00174b",
                    "on-secondary-fixed-variant": "#5c4300",
                    "error-container": "#ffdad6",
                    "secondary-container": "#ffc329",
                    "inverse-primary": "#b4c5ff",
                    "outline": "#737686",
                    "on-surface": "#191c1d",
                    "primary-fixed": "#dbe1ff",
                    "on-primary": "#ffffff",
                    "surface": "#f8f9fa",
                    "tertiary-fixed": "#dae2fd",
                    "tertiary": "#4d556b",
                    "on-primary-container": "#eeefff",
                    "secondary-fixed-dim": "#f9bd22",
                    "outline-variant": "#c3c6d7",
                    "tertiary-fixed-dim": "#bec6e0",
                    "primary": "#004ac6",
                    "surface-container-highest": "#e1e3e4",
                    "secondary": "#795900",
                    "on-tertiary-fixed": "#131b2e",
                    "surface-variant": "#e1e3e4",

                    "primary-fixed-dim": "#b4c5ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "margin-mobile": "16px",
                    "card-padding": "24px",
                    "gutter": "24px",
                    "base": "8px",
                    "container-max": "1200px"
            },
            "fontFamily": {
                    "headline-lg": ["Manrope"],
                    "body-lg": ["Manrope"],
                    "body-md": ["Manrope"],
                    "label-sm": ["Manrope"],
                    "headline-md": ["Manrope"]
            },
            "fontSize": {
                    "headline-lg": ["30px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; }
        .custom-dashed-border {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%232563EB' stroke-width='2' stroke-dasharray='8%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
            border-radius: 16px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-slate-100 dark:border-slate-800 shadow-sm flex items-center justify-between px-4 h-16 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform text-slate-500 dark:text-slate-400 p-2 rounded-full hover:bg-slate-50 dark:hover:bg-slate-900">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-manrope font-bold text-slate-900 dark:text-white text-lg tracking-tight">
<span class="text-blue-600 dark:text-blue-500 font-extrabold">전월세 계약서 AI 체크</span>
</h1>
</div>
<div class="flex items-center">
<button class="active:scale-95 transition-transform text-slate-500 dark:text-slate-400 p-2 rounded-full hover:bg-slate-50 dark:hover:bg-slate-900">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<main class="pt-24 px-4 max-w-[1200px] mx-auto">
<div class="flex flex-col gap-8">
<!-- Title Section -->
<section class="text-center md:text-left">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-2">계약서를 업로드하세요</h2>
<p class="font-body-md text-body-md text-outline">정확한 AI 분석을 위해 계약서 원본 파일 혹은 촬영본을 올려주세요.</p>
</section>
<div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter items-start">
<!-- Left Column: Upload & Config -->
<div class="lg:col-span-7 flex flex-col gap-gutter">
<!-- Upload Area Card -->
<div class="bg-white rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] p-card-padding">
<div class="custom-dashed-border w-full aspect-[4/3] flex flex-col items-center justify-center bg-blue-50/20 group hover:bg-blue-50/40 transition-colors cursor-pointer relative">
<div class="flex flex-col items-center gap-4">
<div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-4xl" data-icon="upload_file">upload_file</span>
</div>
<div class="text-center">
<p class="font-headline-md text-headline-md text-on-background mb-1">파일을 이쪽으로 드래그하세요</p>
<p class="font-body-md text-body-md text-outline">PDF, JPG, PNG 파일을 지원합니다</p>
</div>
<button class="mt-4 px-6 py-3 bg-primary-container text-white rounded-xl font-label-sm active:scale-95 transition-all shadow-md">
                                    파일 선택
                                </button>
</div>
</div>
<!-- Info Box -->
<div class="mt-6 flex items-start gap-3 p-4 bg-surface-container-low rounded-lg border border-outline-variant/30">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="info">info</span>
<p class="font-label-sm text-label-sm text-outline">
                                MVP에서는 분석 목적 외 저장하지 않습니다. 안심하고 사용하세요.
                            </p>
</div>
</div>
<!-- Contract Type Selection -->
<div class="bg-white rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] p-card-padding">
<h3 class="font-headline-md text-headline-md text-on-background mb-6">계약 종류 선택</h3>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
<label class="relative flex flex-col items-center gap-2 p-4 border border-outline-variant rounded-xl cursor-pointer hover:bg-blue-50/50 transition-colors has-[:checked]:border-primary-container has-[:checked]:bg-blue-50 has-[:checked]:ring-1 has-[:checked]:ring-primary-container">
<input checked="" class="hidden" name="contract_type" type="radio" value="월세"/>
<span class="material-symbols-outlined text-2xl" data-icon="calendar_month">calendar_month</span>
<span class="font-label-sm text-label-sm">월세</span>
</label>
<label class="relative flex flex-col items-center gap-2 p-4 border border-outline-variant rounded-xl cursor-pointer hover:bg-blue-50/50 transition-colors has-[:checked]:border-primary-container has-[:checked]:bg-blue-50 has-[:checked]:ring-1 has-[:checked]:ring-primary-container">
<input class="hidden" name="contract_type" type="radio" value="전세"/>
<span class="material-symbols-outlined text-2xl" data-icon="home_work">home_work</span>
<span class="font-label-sm text-label-sm">전세</span>
</label>
<label class="relative flex flex-col items-center gap-2 p-4 border border-outline-variant rounded-xl cursor-pointer hover:bg-blue-50/50 transition-colors has-[:checked]:border-primary-container has-[:checked]:bg-blue-50 has-[:checked]:ring-1 has-[:checked]:ring-primary-container">
<input class="hidden" name="contract_type" type="radio" value="반전세"/>
<span class="material-symbols-outlined text-2xl" data-icon="split_screen">splitscreen</span>
<span class="font-label-sm text-label-sm">반전세</span>
</label>
<label class="relative flex flex-col items-center gap-2 p-4 border border-outline-variant rounded-xl cursor-pointer hover:bg-blue-50/50 transition-colors has-[:checked]:border-primary-container has-[:checked]:bg-blue-50 has-[:checked]:ring-1 has-[:checked]:ring-primary-container">
<input class="hidden" name="contract_type" type="radio" value="모르겠음"/>
<span class="material-symbols-outlined text-2xl" data-icon="help_outline">help_outline</span>
<span class="font-label-sm text-label-sm">모르겠음</span>
</label>
</div>
</div>
</div>
<!-- Right Column: Preview & Action -->
<div class="lg:col-span-5 flex flex-col gap-gutter">
<!-- Extraction Preview Card -->
<div class="bg-white rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] p-card-padding h-full flex flex-col">
<div class="flex items-center justify-between mb-4">
<h3 class="font-headline-md text-headline-md text-on-background">추출된 계약서 내용 확인</h3>
<span class="px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-xs font-bold">Safe</span>
</div>
<div class="flex-grow">
<textarea class="w-full h-[400px] lg:h-full p-4 rounded-xl bg-surface-container-lowest border border-outline-variant focus:border-primary-container focus:ring-4 focus:ring-blue-100 outline-none resize-none font-body-md text-on-surface-variant transition-all" placeholder="이미지를 업로드하면 추출된 텍스트가 여기에 표시됩니다. 분석 전 내용을 직접 수정하실 수 있습니다."></textarea>
</div>
<!-- Footer Action Buttons inside card for desktop parity -->
<div class="grid grid-cols-2 gap-4 mt-6">
<button class="py-4 border border-primary-container text-primary-container rounded-xl font-label-sm hover:bg-blue-50 active:scale-95 transition-all">
                                텍스트 추출하기
                            </button>
<button class="py-4 bg-primary-container text-white rounded-xl font-label-sm shadow-[0_8px_30px_rgba(37,99,235,0.15)] active:scale-95 transition-all">
                                AI 분석 시작
                            </button>
</div>
</div>
<!-- Decorative/Context Card -->
<div class="rounded-xl overflow-hidden relative h-48 shadow-lg">
<img alt="Contract Review Context" class="w-full h-full object-cover" data-alt="modern minimalist office desk with professional contract documents and a legal stamp in warm afternoon light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAdB8qi6pFSpYj6qsz1o5g72O571U-WeLGXSGKjPd27PjtwgLE8BG1qHlrTRIc7ylwAIqtAkhK_P6UaSvTWADQmwxyoI3ieyEtQWVIit0hjYg2bOG8z8SlBycrd-JHxh441IM3Rm5D7M9q3vAm1yr-d3qhxR5tBAIFgFsGq-W0RGfVpy3vAWk5gwBumh_f-D9HMLcEDDeYlMJCgC_LS51YKEoKzY4VNQDE2Chv2LOc0_Qggs4PkDTQV5vkhR9xxvZd1njwLszgJUBYB"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-6">
<p class="text-white font-body-md">24시간 언제나, 당신의 권리를 지키는 인공지능 법률 파트너</p>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Visible on Mobile) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-2 pb-6 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-50 rounded-t-2xl">
<a class="flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 font-bold bg-blue-50/50 dark:bg-blue-900/20 rounded-xl px-4 py-1 active:scale-90 transition-all duration-150" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-manrope text-[11px] font-medium">홈</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 active:scale-90 transition-all duration-150 hover:text-blue-500 dark:hover:text-blue-300" href="#">
<span class="material-symbols-outlined" data-icon="description">description</span>
<span class="font-manrope text-[11px] font-medium">분석 내역</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 active:scale-90 transition-all duration-150 hover:text-blue-500 dark:hover:text-blue-300" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-manrope text-[11px] font-medium">설정</span>
</a>
</nav>
</body></html>
